services:
  mysql:
    image: mysql:8.4
    container_name: diet-agent-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: diet_db
      MYSQL_USER: diet_app
      MYSQL_PASSWORD: ${DB_PASSWORD:-diet-agent-dev-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-diet-agent-root-password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: diet-agent-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-diet-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-diet-minio-change-me}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:9000/minio/health/live > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    container_name: diet-agent-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: diet-agent:local
    container_name: diet-agent-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/diet_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: diet_app
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-diet-agent-dev-password}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-diet-agent-development-jwt-secret-change-before-production-2026}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-86400}
      DIET_LLM_MAIN_MODEL: ${DIET_LLM_MAIN_MODEL:-qwen3-max}
      DIET_LLM_LIGHT_MODEL: ${DIET_LLM_LIGHT_MODEL:-qwen3-max}
      DIET_LLM_AGENT_TIMEOUT_MS: ${DIET_LLM_AGENT_TIMEOUT_MS:-12000}
      DIET_LLM_VISION_CONNECT_TIMEOUT_MS: ${DIET_LLM_VISION_CONNECT_TIMEOUT_MS:-3000}
      DIET_LLM_VISION_READ_TIMEOUT_MS: ${DIET_LLM_VISION_READ_TIMEOUT_MS:-10000}
      DIET_LLM_MAX_ATTEMPTS: ${DIET_LLM_MAX_ATTEMPTS:-2}
      DIET_LLM_INITIAL_BACKOFF_MS: ${DIET_LLM_INITIAL_BACKOFF_MS:-250}
      DIET_LLM_MAX_BACKOFF_MS: ${DIET_LLM_MAX_BACKOFF_MS:-1000}
      DIET_LLM_RETRY_JITTER_MS: ${DIET_LLM_RETRY_JITTER_MS:-100}
      DIET_LLM_CIRCUIT_FAILURE_THRESHOLD: ${DIET_LLM_CIRCUIT_FAILURE_THRESHOLD:-5}
      DIET_LLM_CIRCUIT_OPEN_MS: ${DIET_LLM_CIRCUIT_OPEN_MS:-30000}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      DIET_SESSION_LOCK_KEY_PREFIX: ${DIET_SESSION_LOCK_KEY_PREFIX:-diet:session-lock:}
      DIET_SESSION_LOCK_WAIT_MS: ${DIET_SESSION_LOCK_WAIT_MS:-5000}
      DIET_SESSION_LOCK_WATCHDOG_TIMEOUT_MS: ${DIET_SESSION_LOCK_WATCHDOG_TIMEOUT_MS:-45000}
      DIET_SESSION_LOCK_CONNECT_TIMEOUT_MS: ${DIET_SESSION_LOCK_CONNECT_TIMEOUT_MS:-3000}
      DIET_SESSION_LOCK_COMMAND_TIMEOUT_MS: ${DIET_SESSION_LOCK_COMMAND_TIMEOUT_MS:-2000}
      DIET_SESSION_IDEMPOTENCY_PROCESSING_TIMEOUT_SECONDS: ${DIET_SESSION_IDEMPOTENCY_PROCESSING_TIMEOUT_SECONDS:-90}
      DIET_VISION_MODEL: ${DIET_VISION_MODEL:-qwen3.7-plus}
      DIET_VISION_API_URL: ${DIET_VISION_API_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-diet-minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-diet-minio-change-me}
      MINIO_BUCKET: ${MINIO_BUCKET:-diet-checkin-images}
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/ > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

volumes:
  mysql_data:
  minio_data:
  redis_data:
