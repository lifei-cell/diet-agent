# 敏感信息通过环境变量注入，本地开发可创建 application-local.yml（已在 .gitignore 中排除）
# 需要设置的环境变量：
#   DASHSCOPE_API_KEY — DashScope API 密钥
#   DB_PASSWORD       — MySQL 密码（默认: 123456）
spring:
  application:
    name: harness-agent
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/diet_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:123456}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:db/diet_db.sql
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  data:
    redis:
      # 供 Redisson RLock 客户端使用（不启用 Spring Data Redis）。
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2s}
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.diet.model
  configuration:
    map-underscore-to-camel-case: true
server:
  port: 8080
agentscope:
  dashscope:
    api-key: ${DASHSCOPE_API_KEY:}
diet:
  security:
    jwt:
      # 生产环境必须通过 JWT_SECRET 注入至少 32 字节的随机密钥。
      secret: ${JWT_SECRET:diet-agent-development-jwt-secret-change-before-production-2026}
      expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
  llm:
    main-model: qwen3-max
    light-model: qwen3-max
    resilience:
      # 单次文本 Agent 的阻塞上限；达到上限后可按 max-attempts 重试一次。
      agent-timeout-ms: ${DIET_LLM_AGENT_TIMEOUT_MS:12000}
      # 图像模型使用独立 HTTP 连接/读取超时，避免上传识别长期占用 Web 请求线程。
      vision-connect-timeout-ms: ${DIET_LLM_VISION_CONNECT_TIMEOUT_MS:3000}
      vision-read-timeout-ms: ${DIET_LLM_VISION_READ_TIMEOUT_MS:10000}
      # 总尝试次数（含首次），上限在代码中限制为 3，控制故障时的成本和尾延迟。
      max-attempts: ${DIET_LLM_MAX_ATTEMPTS:2}
      initial-backoff-ms: ${DIET_LLM_INITIAL_BACKOFF_MS:250}
      max-backoff-ms: ${DIET_LLM_MAX_BACKOFF_MS:1000}
      jitter-ms: ${DIET_LLM_RETRY_JITTER_MS:100}
      # 连续可用性故障达到阈值后快速降级；冷却期后放行一次探测调用。
      circuit-failure-threshold: ${DIET_LLM_CIRCUIT_FAILURE_THRESHOLD:5}
      circuit-open-ms: ${DIET_LLM_CIRCUIT_OPEN_MS:30000}
  vision:
    # 可通过 DIET_VISION_MODEL / DIET_VISION_API_URL 覆盖为所属地域和工作空间的多模态模型端点。
    model: ${DIET_VISION_MODEL:qwen3.7-plus}
    api-url: ${DIET_VISION_API_URL:https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
  storage:
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:diet-minio}
      secret-key: ${MINIO_SECRET_KEY:diet-minio-change-me}
      bucket: ${MINIO_BUCKET:diet-checkin-images}
  session:
    max-history-turns: 10
    # 多副本写会话时必须先取得 Redisson RLock；不传 leaseTime 时由 Watchdog 自动续期。
    distributed-lock:
      key-prefix: ${DIET_SESSION_LOCK_KEY_PREFIX:diet:session-lock:}
      wait-ms: ${DIET_SESSION_LOCK_WAIT_MS:5000}
      # Watchdog 租约；持锁 JVM 正常时会自动续期，崩溃后超时释放。时间越长，故障接管越慢。
      watchdog-timeout-ms: ${DIET_SESSION_LOCK_WATCHDOG_TIMEOUT_MS:45000}
      connect-timeout-ms: ${DIET_SESSION_LOCK_CONNECT_TIMEOUT_MS:3000}
      command-timeout-ms: ${DIET_SESSION_LOCK_COMMAND_TIMEOUT_MS:2000}
    # PROCESSING 超过该时间可被同一 requestId 的重试接管；正常结果会持久化并直接复用。
    idempotency-processing-timeout-seconds: ${DIET_SESSION_IDEMPOTENCY_PROCESSING_TIMEOUT_SECONDS:90}
  retrieval:
    # 结构化倒排检索始终启用；关键词通道为“主库硬过滤 + 应用侧 BM25”。
    keyword:
      enabled: ${DIET_RETRIEVAL_KEYWORD_ENABLED:true}
      # 每次进入 BM25 的最大受限语料数；超过此规模建议将 KeywordMealCandidateRetriever 换为 OpenSearch 实现。
      corpus-limit: ${DIET_RETRIEVAL_KEYWORD_CORPUS_LIMIT:500}
      result-limit: ${DIET_RETRIEVAL_KEYWORD_RESULT_LIMIT:50}
      bm25:
        k1: ${DIET_RETRIEVAL_KEYWORD_BM25_K1:1.2}
        b: ${DIET_RETRIEVAL_KEYWORD_BM25_B:0.75}
    # RRF 融合后的最大候选数，后续由 MealRankService 做个性化重排。
    candidate-limit: ${DIET_RETRIEVAL_CANDIDATE_LIMIT:80}
    vector:
      # 仅在部署方已建立按 sourceMode/userId 隔离的向量索引时开启。
      enabled: ${DIET_RETRIEVAL_VECTOR_ENABLED:false}
      endpoint: ${DIET_RETRIEVAL_VECTOR_ENDPOINT:}
      top-k: ${DIET_RETRIEVAL_VECTOR_TOP_K:50}
logging:
  level:
    com.diet: INFO
