# 敏感信息通过环境变量注入，本地开发可创建 application-local.yml（已在 .gitignore 中排除）
# 需要设置的环境变量：
#   DASHSCOPE_API_KEY — DashScope API 密钥
#   DB_PASSWORD       — MySQL 密码（默认: 123456）
spring:
  application:
    name: harness-agent
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/diet_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:123456}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:db/diet_db.sql
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.diet.model
  configuration:
    map-underscore-to-camel-case: true
server:
  port: 8080
agentscope:
  dashscope:
    api-key: ${DASHSCOPE_API_KEY:}
diet:
  security:
    jwt:
      # 生产环境必须通过 JWT_SECRET 注入至少 32 字节的随机密钥。
      secret: ${JWT_SECRET:diet-agent-development-jwt-secret-change-before-production-2026}
      expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
  llm:
    main-model: qwen3-max
    light-model: qwen3-max
  session:
    max-history-turns: 10
logging:
  level:
    com.diet: INFO
