<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>饮食推荐助手</title>
    <link rel="stylesheet" href="./assets/css/app.css">
</head>
<body>
<div class="app-shell">
    <header class="topbar">
        <a class="brand" href="#/diet" aria-label="回到饮食助手首页">
            <span class="brand-mark">D</span>
            <span>
                    <strong>饮食推荐助手</strong>
                    <small>清爽一点，吃得更合适</small>
                </span>
        </a>
        <nav class="nav-links" aria-label="主导航">
            <a href="#/diet" data-nav="/diet">首页</a>
            <a href="#/diet/profile" data-nav="/diet/profile">我的档案</a>
            <a href="#/diet/chat" data-nav="/diet/chat">聊天推荐</a>
            <a href="#/diet/meals/personal" data-nav="/diet/meals/personal">个人餐食</a>
            <a href="#/diet/meals/public" data-nav="/diet/meals/public">公共餐食</a>
            <a href="#/admin/traces" data-nav="/admin/traces">Trace</a>
            <a href="#/admin/evaluations" data-nav="/admin/evaluations">评估</a>
        </nav>
        <div class="user-field">
            <span id="authUserLabel">未登录</span>
            <button id="logoutButton" class="button ghost small" type="button" hidden>退出</button>
        </div>
    </header>

    <main id="app" class="page" tabindex="-1"></main>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<div id="authPanel" class="auth-panel" aria-modal="true" role="dialog" aria-labelledby="authTitle">
    <section class="auth-card">
        <span class="eyebrow">饮食推荐助手</span>
        <h1 id="authTitle">登录后开始使用</h1>
        <p>你的会话、个人餐食、反馈与 Trace 将按账号独立保存。</p>
        <form id="loginForm" class="stack-form">
            <label>用户名<input name="username" autocomplete="username" required minlength="3" maxlength="32"></label>
            <label>密码<input name="password" type="password" autocomplete="current-password" required minlength="8" maxlength="72"></label>
            <button class="button primary" type="submit">登录</button>
            <button id="showRegisterButton" class="button ghost" type="button">注册新账号</button>
        </form>
        <form id="registerForm" class="stack-form" hidden>
            <label>用户名<input name="username" autocomplete="username" required minlength="3" maxlength="32"></label>
            <label>昵称（可选）<input name="displayName" autocomplete="nickname" maxlength="64"></label>
            <label>密码<input name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="72"></label>
            <button class="button primary" type="submit">注册并登录</button>
            <button id="showLoginButton" class="button ghost" type="button">返回登录</button>
        </form>
    </section>
</div>

<script src="./assets/js/api.js"></script>
<script src="./assets/js/app.js"></script>
</body>
</html>
